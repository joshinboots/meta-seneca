[core]
# Use DRM backend directly (module filename form)
backend=drm-backend.so
xwayland=false

[shell]
panel-location=top
locking=false

# Show a button on the panel AND run once on startup
[launcher]
name=Reverse Parking
icon=/usr/share/icons/hicolor/48x48/apps/terminal.png
path=/usr/bin/reverse-parking-launch.sh
autolaunch=true

