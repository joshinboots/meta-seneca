# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES (scan up to 3 levels deep)
BBFILES += " \
  ${LAYERDIR}/recipes-*/*.bb \
  ${LAYERDIR}/recipes-*/*/*.bb \
  ${LAYERDIR}/recipes-*/*/*/*.bb \
  ${LAYERDIR}/recipes-*/*.bbappend \
  ${LAYERDIR}/recipes-*/*/*.bbappend \
  ${LAYERDIR}/recipes-*/*/*/*.bbappend \
"

BBFILE_COLLECTIONS += "meta-seneca"
BBFILE_PATTERN_meta-seneca = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-seneca = "7"

LAYERDEPENDS_meta-seneca = "core"
LAYERSERIES_COMPAT_meta-seneca = "kirkstone"
